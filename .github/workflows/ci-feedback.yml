# Trusted post-run routing for full CI on main. This workflow checks out only the repository's
# default branch, reads bounded GitHub metadata, and never downloads or executes run artifacts.
name: CI feedback

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ci-feedback-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  route:
    name: route full-main result
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run executes this trusted default-branch revision, never the triggering tree.
      - name: Check out trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      # The script independently verifies event, repository, branch, and workflow-path identity.
      # Any metadata/API failure leaves this job red; there is no continue-on-error path.
      - name: Route full-main CI feedback
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun scripts/ci-feedback.ts --event "$GITHUB_EVENT_PATH"
