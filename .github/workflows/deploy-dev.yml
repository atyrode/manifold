# THE OPERATOR'S DEVELOPMENT INSTANCE, consuming every green `main` (docs/SELF-HOST.md
# §Environments). It follows the CI workflow rather than a push, so a commit that failed the gate
# never reaches a running instance, and it is inert unless the repository variable
# DEV_DEPLOY_HOST exists - a fork never runs it. Nothing here names a provider or a host: the
# host, user, URL and key are repository variables and a secret, and the host-side receiver (a
# forced-command SSH key that checks out the sha it is handed and rebuilds the compose project,
# stamping MANIFOLD_VERSION/MANIFOLD_BUILD/MANIFOLD_CHANNEL from scripts/build-identity.ts) is
# documented in the operator's dotfiles. Production is a different file and a different decision
# (deploy-hub.yml).
name: Deploy development
run-name: Deploy development ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# The job token only reads the repository; the Environment record is Actions' own bookkeeping.
permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: development
    if: github.event.workflow_run.conclusion == 'success' && vars.DEV_DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ vars.DEV_DEPLOY_URL }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      DEV_URL: ${{ vars.DEV_DEPLOY_URL }}
    steps:
      - name: Check out the deployed commit
        # The whole history and its tags, because the expected identity is DERIVED from this
        # checkout by the same code the host runs (scripts/build-identity.ts) and then compared
        # to what the instance answers - never re-spelled here.
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Name the expected build
        id: identity
        run: bun scripts/build-identity.ts | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_OUTPUT"

      - name: Hand the host the sha
        # The receiver's key is forced-command: whatever is typed here is ignored as a command
        # and delivered as SSH_ORIGINAL_COMMAND, which is how the sha travels.
        env:
          DEV_DEPLOY_SSH_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
        run: |
          umask 077
          key="$(mktemp)"
          printf '%s\n' "$DEV_DEPLOY_SSH_KEY" > "$key"
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -i "$key" \
            "${{ vars.DEV_DEPLOY_USER }}@${{ vars.DEV_DEPLOY_HOST }}" "$SHA"
          rm -f "$key"

      - name: Development answers with this build
        env:
          EXPECTED: ${{ steps.identity.outputs.build }}
        run: |
          for _ in $(seq 1 60); do
            answer="$(curl -fsS "$DEV_URL/healthz" || true)"
            if [ "$(printf '%s' "$answer" | jq -r .build)" = "$EXPECTED" ]; then
              echo "development runs $EXPECTED ($(printf '%s' "$answer" | jq -r .channel))"
              exit 0
            fi
            sleep 15
          done
          echo "development at $DEV_URL never reported build $EXPECTED; last answer: $answer"; exit 1
