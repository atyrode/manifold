# TEMPORARY (issue #44): reproduce the verify:convergence chromium launch
# failure on the current ubuntu-latest image with stderr visible.
# Delete before merging.
name: CI Debug

on:
  push:
    branches:
      - fix/cdp-runner-diagnostics

permissions:
  contents: read

jobs:
  convergence:
    name: verify-convergence on runner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Browser inventory
        run: |
          for c in chromium chromium-browser google-chrome chrome; do
            p=$(command -v "$c" || true)
            if [ -n "$p" ]; then
              echo "$c -> $p"
              "$p" --version || echo "  ($c --version failed with $?)"
            else
              echo "$c -> (absent)"
            fi
          done

      - name: verify convergence
        run: bun scripts/verify-convergence.ts
