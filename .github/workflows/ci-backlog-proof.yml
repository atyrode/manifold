# Temporary #605 acceptance proof; removed after the fixed fixture source passes all ten runs.
name: CI backlog caller proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ci-backlog-proof.yml
      - packages/agent/**
      - scripts/verify-jobs.ts
      - scripts/verify-runtime.sh

permissions:
  contents: read

jobs:
  caller-jobs:
    name: ten consecutive caller-runner jobs proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact integration tree in the reusable workflow layout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: manifold
          persist-credentials: false
      - name: Install the reusable workflow runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install frozen Manifold dependencies
        working-directory: manifold
        run: bun install --frozen-lockfile
      - name: Install Linux containment fixtures without the main-CI bubblewrap cache
        working-directory: manifold
        run: bash scripts/install-runtime-ci.sh
      - name: Require ten consecutive complete jobs proofs without retries
        working-directory: manifold
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            echo "::group::Caller-runner jobs proof ${attempt}/10"
            bash scripts/verify-runtime.sh --system jobs
            echo "::endgroup::"
            printf 'Jobs proof %s/10 passed.\n' "$attempt" >> "$GITHUB_STEP_SUMMARY"
          done
