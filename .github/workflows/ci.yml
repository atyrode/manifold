# CI fans the registry out across hosted runners; `bun run gate` remains the complete,
# memory-bounded local gate. Keep selectors here and tasks in scripts/gate.ts mechanically aligned.
# Real machine/browser runtime proofs and both preview modes intentionally live outside that local
# gate, but remain mandatory CI jobs and are included in the final required result.
# Browser consumers download the web dist built from this exact commit. A dist is evidence, never a
# cross-tree cache: changing the source SHA necessarily changes the artifact name.
# Exact-tree artifacts expire after one day; rerun the whole workflow rather than reusing partial evidence.
# The under-7-minute SLO assumes enough hosted-runner concurrency; queued time is measured
# separately from execution topology.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - name: Build exact-commit web distribution
        uses: ./.github/actions/gate-slice
        with:
          task: build
      - name: Publish exact-commit web distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manifold-web-dist-${{ github.sha }}
          path: ${{ runner.temp }}/manifold-gate-dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  types:
    name: types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
        with:
          changelog: "true"
      - uses: ./.github/actions/gate-slice
        with:
          task: types

  style:
    name: style
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - uses: ./.github/actions/gate-slice
        with:
          task: style
      - name: Verify CI registry coverage
        run: bun scripts/ci-coverage.ts

  trace:
    name: trace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - uses: ./.github/actions/gate-slice
        with:
          task: trace

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
        with:
          changelog: "true"
      - uses: ./.github/actions/gate-slice
        with:
          task: unit

  e2e:
    name: e2e
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
        with:
          changelog: "true"
      - uses: ./.github/actions/gate-slice
        with:
          task: e2e
          dist: "true"

  convergence:
    name: convergence
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - uses: ./.github/actions/gate-slice
        with:
          task: convergence
          dist: "true"

  terminal-selection:
    name: terminal-selection
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - uses: ./.github/actions/gate-slice
        with:
          task: terminal-selection
          dist: "true"

  terminal-mirror:
    name: terminal-mirror
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - uses: ./.github/actions/gate-slice
        with:
          task: terminal-mirror
          dist: "true"

  tile-drop:
    name: tile-drop
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - uses: ./.github/actions/gate-slice
        with:
          task: tile-drop
          dist: "true"

  budgets:
    name: budgets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - uses: ./.github/actions/gate-slice
        with:
          task: budgets
          dist: "true"

  pwa:
    name: pwa
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - uses: ./.github/actions/gate-slice
        with:
          task: pwa
          dist: "true"

  axioms:
    name: axioms
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
        with:
          changelog: "true"
      - uses: ./.github/actions/gate-slice
        with:
          task: axioms
          dist: "true"

  runtime-jobs:
    name: runtime-jobs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - name: Cache pinned bubblewrap build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/manifold-bwrap-cache
          key: manifold-bwrap-${{ runner.os }}-${{ runner.arch }}-ubuntu-latest-1b80120ef26a28e065e67f89bfef873f13bdd317-${{ hashFiles('scripts/install-runtime-ci.sh') }}
      - name: Install Linux containment fixtures
        env:
          MANIFOLD_BWRAP_CACHE: ${{ runner.temp }}/manifold-bwrap-cache
        run: bash scripts/install-runtime-ci.sh
      - name: Verify real machine jobs
        shell: bash
        run: |
          set +e
          started=$SECONDS
          bash scripts/verify-runtime.sh --system jobs
          status=$?
          elapsed=$((SECONDS - started))
          result=failure
          [[ $status -eq 0 ]] && result=success
          # Markdown backticks are literal receipt formatting, not shell substitutions.
          # shellcheck disable=SC2016
          printf '### Runtime jobs receipt\n\n- Commit: `%s`\n- Result: **%s**\n- Elapsed: %ss\n' "$GITHUB_SHA" "$result" "$elapsed" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  runtime-browser:
    name: runtime-browser
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - name: Download exact-commit web distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: manifold-web-dist-${{ github.sha }}
          path: ${{ runner.temp }}/manifold-gate-dist
      - name: Cache pinned bubblewrap build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/manifold-bwrap-cache
          key: manifold-bwrap-${{ runner.os }}-${{ runner.arch }}-ubuntu-latest-1b80120ef26a28e065e67f89bfef873f13bdd317-${{ hashFiles('scripts/install-runtime-ci.sh') }}
      - name: Install Linux containment fixtures
        env:
          MANIFOLD_BWRAP_CACHE: ${{ runner.temp }}/manifold-bwrap-cache
        run: bash scripts/install-runtime-ci.sh
      - name: Verify browser runtime
        shell: bash
        env:
          MANIFOLD_GATE_DIST: ${{ runner.temp }}/manifold-gate-dist
          MANIFOLD_RUNTIME_PROOF_DIR: ${{ runner.temp }}/runtime-browser-evidence
        run: |
          mkdir -p "$MANIFOLD_RUNTIME_PROOF_DIR"
          set +e
          started=$SECONDS
          bash scripts/verify-runtime.sh --system browser
          status=$?
          elapsed=$((SECONDS - started))
          result=failure
          [[ $status -eq 0 ]] && result=success
          # Markdown backticks are literal receipt formatting, not shell substitutions.
          # shellcheck disable=SC2016
          printf '### Browser runtime receipt\n\n- Commit: `%s`\n- Dist artifact: `manifold-web-dist-%s`\n- Result: **%s**\n- Elapsed: %ss\n' "$GITHUB_SHA" "$GITHUB_SHA" "$result" "$elapsed" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Retain browser runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-browser-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-browser-evidence
          if-no-files-found: warn
          retention-days: 1

  preview-environment:
    name: preview-environment (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, integrated]
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - name: Verify preview development environment
        shell: bash
        env:
          PREVIEW_MODE: ${{ matrix.mode }}
        run: |
          if [[ $PREVIEW_MODE == integrated ]]; then
            bun scripts/verify-preview-environment.ts --integrated
          else
            bun scripts/verify-preview-environment.ts
          fi
      - name: Retain preview evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-environment-${{ matrix.mode }}-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/preview-environment-artifacts-*
          if-no-files-found: warn
          retention-days: 1

  gate:
    name: gate
    if: always()
    needs:
      - build
      - types
      - style
      - trace
      - unit
      - e2e
      - convergence
      - terminal-selection
      - terminal-mirror
      - tile-drop
      - budgets
      - pwa
      - axioms
      - runtime-jobs
      - runtime-browser
      - preview-environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every verification job
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed=0
          count=0
          while IFS=$'\t' read -r job result; do
            count=$((count + 1))
            printf '%-24s %s\n' "$job" "${result:-missing}"
            [[ $result == success ]] || failed=1
          done < <(jq -r 'to_entries[] | [.key, (.value.result // "missing")] | @tsv' <<<"$NEEDS_JSON")
          [[ $count -gt 0 ]] || failed=1
          exit "$failed"
