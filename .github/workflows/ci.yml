# The gate runs on every pull request into main and every push to main; manual dispatch also
# supplies post-merge evidence for repository-token merges, which do not trigger push runs.
# `bun run release` requires green main CI; the Release workflow does not repeat the gate.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"

      - name: Cache bun's download store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gate
        run: bun run gate

  preview-environment:
    name: preview-environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify preview development environment
        run: bun scripts/verify-preview-environment.ts
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-environment-evidence
          path: ${{ runner.temp }}/preview-environment-artifacts-*
          retention-days: 1

  gate:
    name: gate
    if: always()
    needs: [checks, preview-environment]
    runs-on: ubuntu-latest
    steps:
      - name: Require both verification jobs
        env:
          CHECKS: ${{ needs.checks.result }}
          PREVIEW_ENVIRONMENT: ${{ needs.preview-environment.result }}
        run: test "$CHECKS" = success && test "$PREVIEW_ENVIRONMENT" = success
