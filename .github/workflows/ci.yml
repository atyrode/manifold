# CI fans the gate registry out across hosted runners. Pull requests always run the baseline and
# planner-selected risk checks; main pushes and workflow dispatches run the complete inventory.
# `bun run gate` remains the complete, memory-bounded local gate.
# Real machine/browser runtime proofs and both preview modes intentionally live outside that local
# gate, but remain part of every full exact-revision CI proof.
# Browser consumers download the web dist built from this exact commit. A dist is evidence, never a
# cross-tree cache: changing the source SHA necessarily changes the artifact name.
# Exact-tree artifacts expire after one day; rerun the whole workflow rather than reusing partial evidence.
# The 1–2-minute ordinary PR target and under-7-minute full-lane SLO assume hosted-runner capacity.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      risk: ${{ steps.plan.outputs.risk }}
      unitPaths: ${{ steps.plan.outputs.unitPaths }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - name: Select exact-revision checks
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ $EVENT_NAME == pull_request ]]; then
            MERGE_BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            bun scripts/ci-plan.ts --base "$MERGE_BASE_SHA" --head "$HEAD_SHA" --github-output
          else
            bun scripts/ci-plan.ts --full --github-output
          fi

  build:
    name: build
    runs-on: ubuntu-latest
    needs: plan
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - name: Build exact-commit web distribution
        uses: ./.github/actions/gate-slice
        with:
          task: build
      - name: Publish exact-commit web distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manifold-web-dist-${{ github.sha }}
          path: ${{ runner.temp }}/manifold-gate-dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  types:
    name: types (${{ matrix.shard }}/4)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
        with:
          changelog: "true"
      - name: Verify type shard
        run: bun scripts/gate.ts --only types --shard "${{ matrix.shard }}/4"

  style:
    name: style
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - name: Verify formatting, lint, changelog and workspace versions
        uses: ./.github/actions/gate-slice
        with:
          task: style
      - name: Verify CI registry coverage
        run: bun scripts/ci-coverage.ts

  smoke:
    name: smoke
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - name: Download exact-commit web distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: manifold-web-dist-${{ github.sha }}
          path: ${{ runner.temp }}/manifold-gate-dist
      - name: Verify the built server and SDK core path
        env:
          MANIFOLD_GATE_DIST: ${{ runner.temp }}/manifold-gate-dist
        run: bun scripts/verify-ci-smoke.ts

  targeted:
    name: targeted
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
        with:
          changelog: "true"
      - name: Run exact-diff focused tests
        shell: bash
        env:
          UNIT_PATHS: ${{ needs.plan.outputs.unitPaths }}
        run: bun scripts/ci-plan.ts --run-targeted --unit-paths-json "$UNIT_PATHS"

  trace:
    name: trace
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.checks), 'trace')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - uses: ./.github/actions/gate-slice
        with:
          task: trace

  unit:
    name: unit
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.checks), 'unit')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
        with:
          changelog: "true"
      - uses: ./.github/actions/gate-slice
        with:
          task: unit

  e2e-rest:
    name: e2e (testkit except preview recovery)
    needs: [plan, build]
    if: contains(fromJSON(needs.plan.outputs.checks), 'e2e-rest')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
        with:
          changelog: "true"
      - uses: ./.github/actions/gate-slice
        with:
          task: e2e (testkit except preview recovery)
          dist: "true"

  e2e-preview-recovery:
    name: e2e (preview recovery)
    needs: [plan, build]
    if: contains(fromJSON(needs.plan.outputs.checks), 'e2e-preview-recovery')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
        with:
          changelog: "true"
      - uses: ./.github/actions/gate-slice
        with:
          task: e2e (preview recovery)
          dist: "true"

  convergence:
    name: convergence
    needs: [plan, build]
    if: contains(fromJSON(needs.plan.outputs.checks), 'convergence')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - uses: ./.github/actions/gate-slice
        with:
          task: convergence
          dist: "true"

  terminal-selection:
    name: terminal-selection
    needs: [plan, build]
    if: contains(fromJSON(needs.plan.outputs.checks), 'terminal-selection')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - uses: ./.github/actions/gate-slice
        with:
          task: terminal-selection
          dist: "true"

  terminal-mirror:
    # This gate group proves both snapshot rendering and in-place terminal restart.
    name: terminal-mirror
    needs: [plan, build]
    if: contains(fromJSON(needs.plan.outputs.checks), 'terminal-mirror')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - uses: ./.github/actions/gate-slice
        env:
          MANIFOLD_RESTART_SCREENSHOT: ${{ runner.temp }}/terminal-restart.png
        with:
          task: terminal-mirror
          dist: "true"
      - name: Retain terminal restart screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terminal-restart-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/terminal-restart.png
          if-no-files-found: warn
          retention-days: 1

  tile-drop:
    name: tile-drop
    needs: [plan, build]
    if: contains(fromJSON(needs.plan.outputs.checks), 'tile-drop')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - uses: ./.github/actions/gate-slice
        with:
          task: tile-drop
          dist: "true"

  budgets:
    name: budgets
    needs: [plan, build]
    if: contains(fromJSON(needs.plan.outputs.checks), 'budgets')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - uses: ./.github/actions/gate-slice
        with:
          task: budgets
          dist: "true"

  pwa:
    name: pwa
    needs: [plan, build]
    if: contains(fromJSON(needs.plan.outputs.checks), 'pwa')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - uses: ./.github/actions/gate-slice
        with:
          task: pwa
          dist: "true"

  axioms:
    name: axioms
    needs: [plan, build]
    if: contains(fromJSON(needs.plan.outputs.checks), 'axioms')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
        with:
          changelog: "true"
      - uses: ./.github/actions/gate-slice
        with:
          task: axioms
          dist: "true"

  runtime-jobs:
    name: runtime-jobs
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.checks), 'runtime-jobs')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - name: Cache pinned bubblewrap build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/manifold-bwrap-cache
          key: manifold-bwrap-${{ runner.os }}-${{ runner.arch }}-ubuntu-latest-1b80120ef26a28e065e67f89bfef873f13bdd317-${{ hashFiles('scripts/install-runtime-ci.sh') }}
      - name: Install Linux containment fixtures
        env:
          MANIFOLD_BWRAP_CACHE: ${{ runner.temp }}/manifold-bwrap-cache
        run: bash scripts/install-runtime-ci.sh
      - name: Verify real machine jobs
        shell: bash
        run: |
          set +e
          started=$SECONDS
          bash scripts/verify-runtime.sh --system jobs
          status=$?
          elapsed=$((SECONDS - started))
          result=failure
          [[ $status -eq 0 ]] && result=success
          # Markdown backticks are literal receipt formatting, not shell substitutions.
          # shellcheck disable=SC2016
          printf '### Runtime jobs receipt\n\n- Commit: `%s`\n- Result: **%s**\n- Elapsed: %ss\n' "$GITHUB_SHA" "$result" "$elapsed" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  runtime-browser:
    name: runtime-browser
    needs: [plan, build]
    if: contains(fromJSON(needs.plan.outputs.checks), 'runtime-browser')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - name: Download exact-commit web distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: manifold-web-dist-${{ github.sha }}
          path: ${{ runner.temp }}/manifold-gate-dist
      - name: Cache pinned bubblewrap build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/manifold-bwrap-cache
          key: manifold-bwrap-${{ runner.os }}-${{ runner.arch }}-ubuntu-latest-1b80120ef26a28e065e67f89bfef873f13bdd317-${{ hashFiles('scripts/install-runtime-ci.sh') }}
      - name: Install Linux containment fixtures
        env:
          MANIFOLD_BWRAP_CACHE: ${{ runner.temp }}/manifold-bwrap-cache
        run: bash scripts/install-runtime-ci.sh
      - name: Verify browser runtime
        shell: bash
        env:
          MANIFOLD_GATE_DIST: ${{ runner.temp }}/manifold-gate-dist
          MANIFOLD_RUNTIME_PROOF_DIR: ${{ runner.temp }}/runtime-browser-evidence
        run: |
          mkdir -p "$MANIFOLD_RUNTIME_PROOF_DIR"
          set +e
          started=$SECONDS
          bash scripts/verify-runtime.sh --system browser
          status=$?
          elapsed=$((SECONDS - started))
          result=failure
          [[ $status -eq 0 ]] && result=success
          # Markdown backticks are literal receipt formatting, not shell substitutions.
          # shellcheck disable=SC2016
          printf '### Browser runtime receipt\n\n- Commit: `%s`\n- Dist artifact: `manifold-web-dist-%s`\n- Result: **%s**\n- Elapsed: %ss\n' "$GITHUB_SHA" "$GITHUB_SHA" "$result" "$elapsed" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Retain browser runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-browser-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-browser-evidence
          if-no-files-found: warn
          retention-days: 1

  preview-environment:
    name: preview-environment (${{ matrix.mode }})
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.checks), 'preview-environment')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, integrated]
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - name: Verify preview development environment
        shell: bash
        env:
          PREVIEW_MODE: ${{ matrix.mode }}
        run: |
          if [[ $PREVIEW_MODE == integrated ]]; then
            bun scripts/verify-preview-environment.ts --integrated
          else
            bun scripts/verify-preview-environment.ts
          fi
      - name: Retain preview evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-environment-${{ matrix.mode }}-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/preview-environment-artifacts-*
          if-no-files-found: warn
          retention-days: 1

  nix:
    name: nix (${{ matrix.system }})
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.checks), 'nix')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: x86_64-darwin
            runner: macos-15-intel
          - system: aarch64-darwin
            runner: macos-15
    env:
      MANIFOLD_NIX_SYSTEM: ${{ matrix.system }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            sandbox = true
      - name: Verify native Nix packaging
        uses: ./.github/actions/gate-slice
        with:
          task: nix

  gate:
    name: gate
    if: always()
    needs:
      - plan
      - build
      - types
      - style
      - smoke
      - targeted
      - trace
      - unit
      - e2e-rest
      - e2e-preview-recovery
      - convergence
      - terminal-selection
      - terminal-mirror
      - tile-drop
      - budgets
      - pwa
      - axioms
      - runtime-jobs
      - runtime-browser
      - preview-environment
      - nix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require exactly the planned verification jobs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_CHECKS: ${{ needs.plan.outputs.checks }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          universe='["build","types","style","smoke","targeted","trace","unit","e2e-rest","e2e-preview-recovery","convergence","terminal-selection","terminal-mirror","tile-drop","budgets","pwa","axioms","runtime-jobs","runtime-browser","preview-environment","nix"]'
          mandatory='["build","types","style","smoke","targeted"]'
          failed=0

          if [[ $(jq -r '.plan.result // "missing"' <<<"$NEEDS_JSON") != success ]]; then
            echo "planner did not succeed"
            failed=1
          fi
          if ! jq -e --argjson universe "$universe" --argjson mandatory "$mandatory" '
            . as $checks |
            type == "array" and all(.[]; type == "string") and
            (length == (unique | length)) and
            all(.[]; . as $check | $universe | index($check)) and
            all($mandatory[]; . as $check | $checks | index($check))
          ' <<<"$EXPECTED_CHECKS" >/dev/null; then
            echo "planner emitted an invalid, incomplete, or unknown check set: $EXPECTED_CHECKS"
            failed=1
          fi

          if [[ $EVENT_NAME != pull_request ]] &&
            ! jq -e --argjson universe "$universe" 'sort == ($universe | sort)' <<<"$EXPECTED_CHECKS" >/dev/null; then
            echo "main/dispatch proof did not plan the full check universe"
            failed=1
          fi

          expected_needs="$(jq -cn --argjson universe "$universe" '(["plan"] + $universe) | sort')"
          actual_needs="$(jq -c 'keys | sort' <<<"$NEEDS_JSON")"
          if [[ $actual_needs != "$expected_needs" ]]; then
            echo "gate dependency inventory mismatch: $actual_needs"
            failed=1
          fi

          while IFS= read -r check; do
            result="$(jq -r --arg check "$check" '.[$check].result // "missing"' <<<"$NEEDS_JSON")"
            planned="$(jq -r --arg check "$check" 'index($check) != null' <<<"$EXPECTED_CHECKS" 2>/dev/null || echo false)"
            printf '%-24s %-9s planned=%s\n' "$check" "$result" "$planned"
            if [[ $planned == true ]]; then
              [[ $result == success ]] || failed=1
            else
              [[ $result == skipped ]] || failed=1
            fi
          done < <(jq -r '.[]' <<<"$universe")
          exit "$failed"
