# PR PREVIEWS follow each same-repository head and disappear when the PR closes.
# Fork heads never reach the forced-command SSH key; the job also stays inert without
# DEV_DEPLOY_HOST. Host, user and domain come from repository variables, never a provider
# assumption. The receiver and host setup are documented in infra/previews/README.md.
#
# A DOCS-ONLY head deploys nothing: when every changed file is Markdown outside changes/
# there is nothing a preview could show, and `preview up` is a full image build plus a
# resident container on the host. Fragments under changes/ DO render in the app (the
# unreleased entry), so they count as code. The decision is re-made on every push from the
# PR's whole diff, so a PR that grows code later deploys then, and teardown on close is
# unconditional because `preview down` is idempotent.
name: Deploy preview
run-name: Preview PR ${{ github.event.pull_request.number }} (${{ github.event.action }})

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: preview
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.DEV_DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://${{ github.event.pull_request.number }}.${{ vars.PREVIEW_DOMAIN }}
    env:
      N: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      PREVIEW_URL: https://${{ github.event.pull_request.number }}.${{ vars.PREVIEW_DOMAIN }}
      DEV_DEPLOY_USER: ${{ vars.DEV_DEPLOY_USER }}
      DEV_DEPLOY_HOST: ${{ vars.DEV_DEPLOY_HOST }}
    steps:
      - name: Decide whether this head has anything to show
        id: diff
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const docsOnly = (f) => f.filename.endsWith(".md") && !f.filename.startsWith("changes/");
            const showable = files.filter((f) => !docsOnly(f));
            core.info(`${files.length} changed file(s), ${showable.length} outside docs`);
            core.setOutput("deploy", showable.length > 0 ? "true" : "false");

      - name: Deploy the PR head
        if: github.event.action != 'closed' && steps.diff.outputs.deploy == 'true'
        env:
          DEV_DEPLOY_SSH_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
        run: |
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$DEV_DEPLOY_SSH_KEY" > "$key"
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -i "$key" \
            "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST" "preview up $N $SHA"

      # Posted on the FIRST deploy rather than on `opened`, so a PR that starts docs-only
      # and later touches code still gets its link exactly once.
      - name: Post the preview URL once
        if: github.event.action != 'closed' && steps.diff.outputs.deploy == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = `Preview: ${process.env.PREVIEW_URL}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            if (comments.some((c) => c.body?.startsWith(marker))) return;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: [
                marker,
                "It follows every push to this PR. Open this ordinary URL using your production identity; no preview key or token is needed.",
                `The browser title names PR ${process.env.N}, and the teal favicon distinguishes it from production and the integrated preview.`,
              ].join("\n\n"),
            });

      - name: Tear down the closed PR
        if: github.event.action == 'closed'
        env:
          DEV_DEPLOY_SSH_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
        run: |
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$DEV_DEPLOY_SSH_KEY" > "$key"
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -i "$key" \
            "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST" "preview down $N"
