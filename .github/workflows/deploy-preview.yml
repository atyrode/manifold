# PR PREVIEWS follow each same-repository head and disappear when the PR closes.
# Fork heads never reach the forced-command SSH key; the job also stays inert without
# DEV_DEPLOY_HOST. Host, user and domain come from repository variables, never a provider
# assumption. The receiver and host setup are documented in infra/previews/README.md.
name: Deploy preview
run-name: Preview PR ${{ github.event.pull_request.number }} (${{ github.event.action }})

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: preview
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.DEV_DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://${{ github.event.pull_request.number }}.${{ vars.PREVIEW_DOMAIN }}
    env:
      N: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      PREVIEW_URL: https://${{ github.event.pull_request.number }}.${{ vars.PREVIEW_DOMAIN }}
      DEV_DEPLOY_USER: ${{ vars.DEV_DEPLOY_USER }}
      DEV_DEPLOY_HOST: ${{ vars.DEV_DEPLOY_HOST }}
    steps:
      - name: Deploy the PR head
        if: github.event.action != 'closed'
        env:
          DEV_DEPLOY_SSH_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
        run: |
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$DEV_DEPLOY_SSH_KEY" > "$key"
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -i "$key" \
            "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST" "preview up $N $SHA"

      - name: Post the first preview URL
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: [
                `Preview: ${process.env.PREVIEW_URL}`,
                "It follows every push to this PR. It is seeded from the development instance, so the development owner key opens it.",
                `On the host, \`infra/previews/preview.sh url ${process.env.N}\` prints the pre-authenticated link only to the operator's local terminal. Do not paste that key-bearing link into this PR or logs.`,
              ].join("\n\n"),
            });

      - name: Tear down the closed PR
        if: github.event.action == 'closed'
        env:
          DEV_DEPLOY_SSH_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
        run: |
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$DEV_DEPLOY_SSH_KEY" > "$key"
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -i "$key" \
            "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST" "preview down $N"
