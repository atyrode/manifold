name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  # Provenance attestations for the published binaries and image (actions/attest-build-provenance).
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build fleet binaries
        # Compiled single-file binaries for fleet consumers (dotfiles pins
        # these assets). The nix flake's bunDeps fixed-output derivation
        # proved non-reproducible across machines (#51), so release assets
        # are the stable consumption path; the flake stays for development.
        run: |
          bun build --compile packages/agent/src/main.ts --outfile manifold-agent-linux-x64
          bun build --compile --target=bun-darwin-arm64 packages/agent/src/main.ts --outfile manifold-agent-darwin-arm64

      - name: Build release notes
        run: bun scripts/release-notes.ts "${GITHUB_REF_NAME}" > release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" manifold-agent-linux-x64 manifold-agent-darwin-arm64 --verify-tag --title "manifold ${GITHUB_REF_NAME}" --notes-file release-notes.md

      - name: Attest the fleet binaries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            manifold-agent-linux-x64
            manifold-agent-darwin-arm64

      - name: Publish the hub image
        # The self-hosting artifact: one image per tag under THIS repository's namespace (a
        # fork publishes its own), never a mutable `latest` (docs/SELF-HOST.md §Install).
        # The image carries its identity as ARGs (scripts/build-identity.ts): a release IS its
        # tag, so version and build are the tag without `v` and the channel is `release`.
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build \
            --build-arg MANIFOLD_VERSION="$version" \
            --build-arg MANIFOLD_BUILD="$version" \
            --build-arg MANIFOLD_CHANNEL=release \
            -t "$image:${GITHUB_REF_NAME}" .
          docker push "$image:${GITHUB_REF_NAME}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image:${GITHUB_REF_NAME}")"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - name: Attest the hub image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
