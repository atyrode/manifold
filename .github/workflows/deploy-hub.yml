# THE OPERATOR'S PRODUCTION INSTANCE (manifold.tyrode.dev on Clever Cloud), promoted to a
# published release by an explicit dispatch — never by a release or a green main (ADR 0022,
# amended by #244; docs/SELF-HOST.md §Environments). One deployment, not THE deployment: this is
# the only file in the tree allowed to name a hosting provider (verify:axioms S17), and it is
# inert unless the repository variable CLEVER_HUB_APP_ID exists - a fork never runs it.
# Self-hosting is docs/SELF-HOST.md; replace this file with whatever consumes YOUR releases.
name: Deploy production
run-name: Deploy production ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to promote to production
        required: true
        type: string
      bootstrap_gate:
        description: Permit one-time bootstrap only when the target export door returns unknown action
        required: false
        default: false
        type: boolean

# The job token reads the repository, releases and exact-revision full CI evidence. The
# Environment record is Actions' own bookkeeping and needs no `deployments` grant.
permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-hub
  cancel-in-progress: false

jobs:
  release:
    name: Validate release revision
    if: vars.CLEVER_HUB_APP_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Validate the published release
        id: release
        # A tag alone is not a release: it must be a PUBLISHED (non-draft) GitHub Release, which
        # is what `bun run release` produces and the only thing production may run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Select an explicit vMAJOR.MINOR.PATCH release tag"
            exit 1
          fi
          if ! draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"; then
            echo "::error::$TAG has no GitHub Release; publish it with bun run release first"
            exit 1
          fi
          if [ "$draft" != false ]; then
            echo "::error::$TAG is a draft release, not a published one"
            exit 1
          fi
          sha="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          proof="$(gh run list --workflow ci.yml --branch main --commit "$sha" \
            --limit 100 --json databaseId,event,status,conclusion \
            --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")] | .[:1] | map(select(.status == "completed" and .conclusion == "success")) | length')"
          if [ "$proof" -eq 0 ]; then
            echo "::error::$TAG ($sha) has no successful latest full main CI proof (missing, pending, or failed); inspect bun run ci:status -- --sha $sha before promoting"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  installed-bundles:
    name: installed-bundles
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHA: ${{ needs.release.outputs.sha }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - name: Build the exact release candidate
        run: |
          [[ $(git rev-parse HEAD) == "$SHA" ]]
          docker build --tag "installed-bundles:$SHA" \
            --build-arg MANIFOLD_VERSION="${TAG#v}" \
            --build-arg MANIFOLD_BUILD="${TAG#v}" --build-arg MANIFOLD_CHANNEL=release .
      - name: Check production's installed bundles without changing it
        env:
          INSTALLED_BUNDLES_ORIGIN: ${{ vars.MANIFOLD_HUB_ORIGIN }}
          INSTALLED_BUNDLES_TOKEN: ${{ secrets.HUB_INSTALLED_BUNDLES_TOKEN }}
          INSTALLED_BUNDLES_BOOTSTRAP_GATE: ${{ inputs.bootstrap_gate }}
        run: bun scripts/installed-bundles.ts "installed-bundles:$SHA"

  clever:
    name: manifold.tyrode.dev
    needs: [release, installed-bundles]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      switch_started: ${{ steps.switch.outputs.started }}
      previous_sha: ${{ steps.snapshot.outputs.previous_sha }}
      previous_build: ${{ steps.snapshot.outputs.previous_build }}
    # Production protection remains on the switch, after the read-only candidate gate.
    environment:
      name: production
      url: https://manifold.tyrode.dev
    env:
      TAG: ${{ inputs.tag }}
      CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
      CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace

      - name: Link the application
        run: bunx clever-tools@4.10.0 link "${{ vars.CLEVER_HUB_APP_ID }}" --org "${{ vars.CLEVER_ORG_ID }}"

      - name: Snapshot live state before the switch
        id: snapshot
        env:
          VERIFY_LIVE_ORIGIN: ${{ vars.MANIFOLD_HUB_ORIGIN }}
          VERIFY_LIVE_TOKEN: ${{ secrets.HUB_INSTALLED_BUNDLES_TOKEN }}
        run: |
          bun scripts/verify-live.ts snapshot "$RUNNER_TEMP/verify-live.json"
          source infra/previews/deployment-order.sh
          fail() { echo "::error::$*" >&2; exit 1; }
          previous_build="$(jq -er .build "$RUNNER_TEMP/verify-live.json")"
          [[ "$previous_build" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail 'Production rollback requires an exact release build'
          previous_sha="$(legacy_image_revision "$GITHUB_WORKSPACE" "$previous_build")"
          printf 'previous_sha=%s\nprevious_build=%s\n' "$previous_sha" "$previous_build" >> "$GITHUB_OUTPUT"

      - name: Retain the pre-switch snapshot for verification and rollback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-live-production-${{ github.run_id }}
          path: ${{ runner.temp }}/verify-live.json
          retention-days: 1
          if-no-files-found: error

      - name: Stamp the build
        id: switch
        # What /healthz will answer (scripts/build-identity.ts): a release is its tag.
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          bunx clever-tools@4.10.0 env set MANIFOLD_VERSION "${TAG#v}"
          bunx clever-tools@4.10.0 env set MANIFOLD_BUILD "${TAG#v}"
          bunx clever-tools@4.10.0 env set MANIFOLD_CHANNEL release

      - name: Deploy the tag
        run: bunx clever-tools@4.10.0 deploy --tag "$TAG" --force

  verify-live:
    name: verify-live
    needs: [release, clever]
    if: always() && !cancelled() && needs.clever.outputs.switch_started == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERIFY_LIVE_ORIGIN: ${{ vars.MANIFOLD_HUB_ORIGIN }}
      VERIFY_LIVE_TOKEN: ${{ secrets.HUB_INSTALLED_BUNDLES_TOKEN }}
      CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
      CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verify-live-production-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: Verify the promoted release's live state within five minutes
        env:
          TAG: ${{ inputs.tag }}
        run: bun scripts/verify-live.ts verify "$RUNNER_TEMP/verify-live.json" "${TAG#v}"
      - name: Restore the previous production revision
        if: failure() || needs.clever.result != 'success'
        env:
          PREVIOUS_SHA: ${{ needs.clever.outputs.previous_sha }}
          PREVIOUS_BUILD: ${{ needs.clever.outputs.previous_build }}
        run: |
          printf '### Automatic production rollback\n\nSwitch or live verification failed. Restoring `%s`; this run remains failed.\n\n' "$PREVIOUS_SHA" >> "$GITHUB_STEP_SUMMARY"
          bunx clever-tools@4.10.0 link "${{ vars.CLEVER_HUB_APP_ID }}" --org "${{ vars.CLEVER_ORG_ID }}"
          bunx clever-tools@4.10.0 env set MANIFOLD_VERSION "$PREVIOUS_BUILD"
          bunx clever-tools@4.10.0 env set MANIFOLD_BUILD "$PREVIOUS_BUILD"
          bunx clever-tools@4.10.0 env set MANIFOLD_CHANNEL release
          bunx clever-tools@4.10.0 restart --commit "$PREVIOUS_SHA"
          bun scripts/verify-live.ts verify "$RUNNER_TEMP/verify-live.json" "$PREVIOUS_BUILD"
          printf 'The previous revision `%s` is serving and its live-state parity is verified.\n\n' "$PREVIOUS_SHA" >> "$GITHUB_STEP_SUMMARY"

  fleet-pin:
    name: Pin the verified production fleet
    needs: [release, clever, verify-live]
    if: always() && !cancelled() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Require successful switch and live verification
        env:
          SWITCH_RESULT: ${{ needs.clever.result }}
          VERIFY_RESULT: ${{ needs.verify-live.result }}
        run: |
          if [ "$SWITCH_RESULT" != success ] || [ "$VERIFY_RESULT" != success ]; then
            echo "::error::Production deployment requires a successful switch and verify-live; got $SWITCH_RESULT and $VERIFY_RESULT"
            exit 1
          fi

      - name: Dispatch the fleet pin
        # Hub first, then the fleet (docs/CONTRACTS.md §Protocol and compatibility), as a SEQUENCE rather than a cron racing a
        # guard: the dotfiles pin workflow bumps the agent to this release. Skipped when the
        # token is absent; the dotfiles cron and its /healthz hold stay as the floor. The token,
        # its scope and its expiry: docs/SELF-HOST.md §Fleet pin after promotion.
        if: env.GH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.DOTFILES_DISPATCH_TOKEN }}
        run: gh workflow run update-pins.yml --repo atyrode/dotfiles

      - name: Production now runs this release
        run: echo "Production now runs $TAG; pin the fleet to $TAG (atyrode/dotfiles)"
