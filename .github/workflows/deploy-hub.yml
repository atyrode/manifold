# THE OPERATOR'S PRODUCTION INSTANCE (manifold.tyrode.dev on Clever Cloud), promoted to a
# published release by an explicit dispatch — never by a release or a green main (ADR 0022,
# amended by #244; docs/SELF-HOST.md §Environments). One deployment, not THE deployment: this is
# the only file in the tree allowed to name a hosting provider (verify:axioms S17), and it is
# inert unless the repository variable CLEVER_HUB_APP_ID exists - a fork never runs it.
# Self-hosting is docs/SELF-HOST.md; replace this file with whatever consumes YOUR releases.
name: Deploy production
run-name: Deploy production ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to promote to production
        required: true
        type: string
      recovery_checkpoint:
        description: Authenticated full-state checkpoint id captured from the current release
        required: true
        type: string
      recovery_sha256:
        description: SHA-256 of the encrypted full-state checkpoint object
        required: true
        type: string
      recovery_build:
        description: Exact incumbent source build recorded in the verified checkpoint receipt
        required: true
        type: string
      bootstrap_gate:
        description: Permit one-time bootstrap only when the target export door returns unknown action
        required: false
        default: false
        type: boolean

# The job token only reads source, releases, merged PR checks and full CI evidence.
# Attestations are verified from release bundles; no write, OIDC or admin grant is needed.
# The Environment record is Actions' own bookkeeping and needs no `deployments` grant.
permissions:
  actions: read
  contents: read
  checks: read
  statuses: read
  pull-requests: read

concurrency:
  group: deploy-hub
  cancel-in-progress: false

# Reviewed from the official 4.10.0 release asset, not downloaded checksum metadata at runtime.
# https://github.com/CleverCloud/clever-tools/releases/tag/4.10.0
env:
  CLEVER_VERSION: "4.10.0"
  CLEVER_ARCHIVE_SHA256: 8f2704b2d4609158703341ab2239f9ad21ad041dba167c57a3560ae6ea5fe9b9

jobs:
  release:
    name: Validate release revision
    if: vars.CLEVER_HUB_APP_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      image: ${{ steps.release.outputs.image }}
    env:
      TAG: ${{ inputs.tag }}
      RECOVERY_CHECKPOINT: ${{ inputs.recovery_checkpoint }}
      RECOVERY_SHA256: ${{ inputs.recovery_sha256 }}
      RECOVERY_BUILD: ${{ inputs.recovery_build }}
    steps:
      - name: Require a dispatch from main
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ "$DISPATCH_REF" != refs/heads/main ]; then
            echo "::error::Production promotion must be dispatched from main"
            exit 1
          fi
      # Pin trusted main policy to the dispatch revision, never to the candidate tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/bun-workspace

      - name: Verify the immutable release and its provenance
        id: release
        # The candidate always meets the attested policy; recovery mode resolves the incumbent below.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Select an explicit vMAJOR.MINOR.PATCH release tag"
            exit 1
          fi
          if [[ ! "$RECOVERY_CHECKPOINT" =~ ^[a-z0-9][a-z0-9._-]{0,95}$ ]]; then
            echo "::error::Select the exact pre-switch full-state checkpoint"
            exit 1
          fi
          if [[ ! "$RECOVERY_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::The recovery checkpoint requires its exact encrypted-object SHA-256"
            exit 1
          fi
          if [[ ! "$RECOVERY_BUILD" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The recovery receipt requires its exact incumbent source build"
            exit 1
          fi
          proof="$(bun scripts/release-provenance.ts promotion "$TAG")"
          sha="$(jq -er .sha <<< "$proof")"
          for recovery_path in \
            infra/release.Dockerfile \
            infra/recovery.Dockerfile \
            infra/recovery-entrypoint.sh \
            scripts/full-state-recovery.ts; do
            if ! git cat-file -e "$sha:$recovery_path"; then
              echo "::error::$TAG predates the required release/recovery scaffold ($recovery_path is absent)"
              exit 1
            fi
          done
          jq -r '"sha=\(.sha)\nimage=\(.image)"' <<< "$proof" >> "$GITHUB_OUTPUT"

  installed-bundles:
    name: installed-bundles
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      bootstrap_required: ${{ steps.installed.outputs.bootstrap_required }}
    env:
      IMAGE: ${{ needs.release.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - name: Pull the attested release candidate
        run: docker pull "$IMAGE"
      - name: Check production's installed bundles without changing it
        id: installed
        env:
          INSTALLED_BUNDLES_ORIGIN: ${{ vars.MANIFOLD_HUB_ORIGIN }}
          INSTALLED_BUNDLES_TOKEN: ${{ secrets.HUB_INSTALLED_BUNDLES_TOKEN }}
          INSTALLED_BUNDLES_BOOTSTRAP_GATE: ${{ inputs.bootstrap_gate }}
        run: bun scripts/installed-bundles.ts "$IMAGE"

  clever:
    name: manifold.tyrode.dev
    needs: [release, installed-bundles]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      switch_started: ${{ steps.switch.outputs.started }}
      previous_build: ${{ steps.snapshot.outputs.previous_build }}
      previous_image: ${{ steps.snapshot.outputs.previous_image }}
    # Production protection remains on the switch, after the read-only candidate gate.
    environment:
      name: production
      url: https://manifold.tyrode.dev
    env:
      TAG: ${{ inputs.tag }}
      IMAGE: ${{ needs.release.outputs.image }}
      CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
      CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace

      - name: Install the verified standalone deployment tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RUNNER_OS" = Linux && "$RUNNER_ARCH" = X64 ]] || {
            echo "::error::The pinned deployment tool requires a Linux x64 runner"
            exit 1
          }
          tool_dir="$(mktemp -d "$RUNNER_TEMP/clever-tools.XXXXXX")"
          archive="clever-tools-${CLEVER_VERSION}_linux.tar.gz"
          gh release download "$CLEVER_VERSION" --repo CleverCloud/clever-tools \
            --pattern "$archive" --dir "$tool_dir"
          printf '%s  %s\n' "$CLEVER_ARCHIVE_SHA256" "$tool_dir/$archive" | sha256sum --check --strict
          tar -xzf "$tool_dir/$archive" -C "$tool_dir"
          executable="$tool_dir/clever-tools-${CLEVER_VERSION}_linux/clever"
          test -x "$executable"
          printf 'CLEVER=%s\n' "$executable" >> "$GITHUB_ENV"

      - name: Link the application
        run: '"$CLEVER" link "${{ vars.CLEVER_HUB_APP_ID }}" --org "${{ vars.CLEVER_ORG_ID }}"'
      - name: Require the bounded single-writer topology
        run: |
          fail() { echo "::error::$*" >&2; exit 1; }
          status="$("$CLEVER" status --format json)"
          jq -e '.scalability.horizontal.min == 1 and .scalability.horizontal.max == 1' \
            <<< "$status" >/dev/null ||
            fail 'Production recovery requires exactly one application instance'
          [ "$("$CLEVER" config get zero-downtime)" = false ] ||
            fail 'Production recovery requires zero-downtime deployment to be disabled'
      - name: Refuse promotion from an unreconciled recovery image
        run: |
          if ! "$CLEVER" env --format json |
            jq -e '[.env[], .fromAddons[].env[], .fromDependencies[].env[]] |
              all(.[]; if (.name | startswith("MANIFOLD_RECOVERY_")) then .value == "" else true end)' >/dev/null; then
            echo "::error::Active recovery state requires separately reviewed reconciliation before ordinary promotion"
            exit 1
          fi

      - name: Snapshot live state before the switch
        id: snapshot
        env:
          VERIFY_LIVE_ORIGIN: ${{ vars.MANIFOLD_HUB_ORIGIN }}
          VERIFY_LIVE_TOKEN: ${{ secrets.HUB_INSTALLED_BUNDLES_TOKEN }}
          RECOVERY_BUILD: ${{ inputs.recovery_build }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/verify-live.ts snapshot "$RUNNER_TEMP/verify-live.json"
          fail() { echo "::error::$*" >&2; exit 1; }
          previous_build="$(jq -er .build "$RUNNER_TEMP/verify-live.json")"
          [[ "$previous_build" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail 'Production rollback requires an exact release build'
          [ "$RECOVERY_BUILD" = "$previous_build" ] ||
            fail 'The checkpoint receipt was not captured from the currently serving release'
          proof="$(bun scripts/release-provenance.ts recovery "v$previous_build")"
          previous_image="$(jq -er .image <<< "$proof")"
          # Recovery builds FROM this digest only after a failed switch; prove it still resolves first.
          docker manifest inspect "$previous_image" >/dev/null ||
            fail 'The rollback image is no longer resolvable in its registry'
          printf 'previous_build=%s\nprevious_image=%s\n' \
            "$previous_build" "$previous_image" >> "$GITHUB_OUTPUT"

      - name: Retain the pre-switch snapshot for verification and rollback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-live-production-${{ github.run_id }}
          path: ${{ runner.temp }}/verify-live.json
          retention-days: 1
          if-no-files-found: error

      - name: Select the ordinary image and clear prior recovery settings
        id: switch
        run: |
          echo 'started=true' >> "$GITHUB_OUTPUT"
          # Application environment is forwarded as Docker --build-arg by the provider:
          # https://www.clever.cloud/developers/doc/deploy/applications/docker/#build-time-variables
          "$CLEVER" env set MANIFOLD_RELEASE_IMAGE "$IMAGE"
          "$CLEVER" env set CC_DOCKERFILE infra/release.Dockerfile
          "$CLEVER" env set MANIFOLD_RECOVERY_CHECKPOINT ""
          "$CLEVER" env set MANIFOLD_RECOVERY_SHA256 ""
          "$CLEVER" env set MANIFOLD_RECOVERY_EXPECTED_BUILD ""
          "$CLEVER" env set MANIFOLD_RECOVERY_BASE_IMAGE ""

      - name: Stamp the build
        # What /healthz will answer (scripts/build-identity.ts): a release is its tag.
        run: |
          "$CLEVER" env set MANIFOLD_VERSION "${TAG#v}"
          "$CLEVER" env set MANIFOLD_BUILD "${TAG#v}"
          "$CLEVER" env set MANIFOLD_CHANNEL release

      - name: Deploy the attested image through the release wrapper
        # The tag supplies only the reviewed wrapper; no application source is rebuilt.
        run: '"$CLEVER" deploy --tag "$TAG" --force --same-commit-policy rebuild'

  verify-live:
    name: verify-live
    needs: [release, installed-bundles, clever]
    if: always() && !cancelled() && needs.clever.outputs.switch_started == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      maintenance_required: ${{ steps.candidate.outputs.maintenance_required }}
    env:
      VERIFY_LIVE_ORIGIN: ${{ vars.MANIFOLD_HUB_ORIGIN }}
      VERIFY_LIVE_TOKEN: ${{ secrets.HUB_INSTALLED_BUNDLES_TOKEN }}
      CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
      CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bun-workspace
      - name: Install the verified standalone deployment tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RUNNER_OS" = Linux && "$RUNNER_ARCH" = X64 ]] || {
            echo "::error::The pinned deployment tool requires a Linux x64 runner"
            exit 1
          }
          tool_dir="$(mktemp -d "$RUNNER_TEMP/clever-tools.XXXXXX")"
          archive="clever-tools-${CLEVER_VERSION}_linux.tar.gz"
          gh release download "$CLEVER_VERSION" --repo CleverCloud/clever-tools \
            --pattern "$archive" --dir "$tool_dir"
          printf '%s  %s\n' "$CLEVER_ARCHIVE_SHA256" "$tool_dir/$archive" | sha256sum --check --strict
          tar -xzf "$tool_dir/$archive" -C "$tool_dir"
          executable="$tool_dir/clever-tools-${CLEVER_VERSION}_linux/clever"
          test -x "$executable"
          printf 'CLEVER=%s\n' "$executable" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verify-live-production-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: Verify the promoted release's live state within five minutes
        id: candidate
        env:
          TAG: ${{ inputs.tag }}
          VERIFY_LIVE_BOOTSTRAP_GATE: ${{ needs.installed-bundles.outputs.bootstrap_required == 'true' }}
        run: bun scripts/verify-live.ts verify "$RUNNER_TEMP/verify-live.json" "${TAG#v}"
      - name: Restore the authenticated full state with the previous release
        if: failure() || needs.clever.result != 'success'
        env:
          TAG: ${{ inputs.tag }}
          PREVIOUS_BUILD: ${{ needs.clever.outputs.previous_build }}
          PREVIOUS_IMAGE: ${{ needs.clever.outputs.previous_image }}
          RECOVERY_CHECKPOINT: ${{ inputs.recovery_checkpoint }}
          RECOVERY_SHA256: ${{ inputs.recovery_sha256 }}
        run: |
          printf '### Automatic production recovery\n\nSwitch or live verification failed. Restoring the authenticated pre-switch state under release `%s`; this run remains failed.\n\n' "$PREVIOUS_BUILD" >> "$GITHUB_STEP_SUMMARY"
          "$CLEVER" link "${{ vars.CLEVER_HUB_APP_ID }}" --org "${{ vars.CLEVER_ORG_ID }}"
          "$CLEVER" env set MANIFOLD_VERSION "$PREVIOUS_BUILD"
          "$CLEVER" env set MANIFOLD_BUILD "$PREVIOUS_BUILD"
          "$CLEVER" env set MANIFOLD_CHANNEL release
          "$CLEVER" env set CC_DOCKERFILE infra/recovery.Dockerfile
          "$CLEVER" env set MANIFOLD_RECOVERY_CHECKPOINT "$RECOVERY_CHECKPOINT"
          "$CLEVER" env set MANIFOLD_RECOVERY_SHA256 "$RECOVERY_SHA256"
          "$CLEVER" env set MANIFOLD_RECOVERY_EXPECTED_BUILD "$PREVIOUS_BUILD"
          "$CLEVER" env set MANIFOLD_RECOVERY_BASE_IMAGE "$PREVIOUS_IMAGE"
          "$CLEVER" deploy --tag "$TAG" --force --same-commit-policy rebuild
          bun scripts/verify-live.ts verify "$RUNNER_TEMP/verify-live.json" "$PREVIOUS_BUILD"
          printf 'The exact previous application is serving through the recovery image, and its restored live-state parity is verified. Recovery settings remain active so a provider restart restores the same checkpoint and then the checkpoint-specific SQLite replica history.\n\n' >> "$GITHUB_STEP_SUMMARY"

  fleet-pin:
    name: Pin the verified production fleet
    needs: [release, clever, verify-live]
    if: always() && !cancelled() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Require successful switch and live verification
        env:
          SWITCH_RESULT: ${{ needs.clever.result }}
          VERIFY_RESULT: ${{ needs.verify-live.result }}
          MAINTENANCE_REQUIRED: ${{ needs.verify-live.outputs.maintenance_required }}
        run: |
          if [ "$SWITCH_RESULT" != success ] || [ "$VERIFY_RESULT" != success ]; then
            echo "::error::Production deployment requires a successful switch and verify-live; got $SWITCH_RESULT and $VERIFY_RESULT"
            exit 1
          fi
          if [ "$MAINTENANCE_REQUIRED" != true ] && [ "$MAINTENANCE_REQUIRED" != false ]; then
            echo "::error::Production verification returned no explicit maintenance result; fleet pin remains blocked"
            exit 1
          fi

      - name: Continue production maintenance before pinning the fleet
        if: needs.verify-live.outputs.maintenance_required == 'true'
        run: |
          echo "::warning::Production $TAG requires plugin maintenance, not full-health acceptance. No fleet pin was dispatched. Install the named repacked plugins and run ordinary verify-live without VERIFY_LIVE_BOOTSTRAP_GATE before pinning."
          printf '### Production maintenance required\n\nRelease `%s` passed only the one-deployment maintenance check. No fleet pin was dispatched. Install the repacked plugins named by verify-live, retain the pre-switch snapshot, and run ordinary `scripts/verify-live.ts verify PATH EXPECTED_BUILD` with `VERIFY_LIVE_BOOTSTRAP_GATE` unset. Only ordinary verification ends maintenance and permits the fleet pin.\n\n' "$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch the fleet pin
        # Hub first, then the fleet (docs/CONTRACTS.md §Protocol and compatibility), as a SEQUENCE rather than a cron racing a
        # guard: the dotfiles pin workflow bumps the agent to this release. Skipped when the
        # token is absent; the dotfiles cron and its /healthz hold stay as the floor. The token,
        # its scope and its expiry: docs/SELF-HOST.md §Fleet pin after promotion.
        if: needs.verify-live.outputs.maintenance_required == 'false' && env.GH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.DOTFILES_DISPATCH_TOKEN }}
        run: gh workflow run update-pins.yml --repo atyrode/dotfiles

      - name: Production now runs this release
        if: needs.verify-live.outputs.maintenance_required == 'false'
        run: echo "Production now runs $TAG; pin the fleet to $TAG (atyrode/dotfiles)"
