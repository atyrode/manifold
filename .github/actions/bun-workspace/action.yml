name: Prepare Bun workspace
description: Install the pinned Bun toolchain and frozen workspace dependencies.

inputs:
  changelog:
    description: Generate the gitignored web changelog imported by web TypeScript.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: "1.4.2"

    - name: Cache Bun download store
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Generate web changelog
      if: inputs.changelog == 'true'
      shell: bash
      run: bun scripts/generate-web-changelog.ts
