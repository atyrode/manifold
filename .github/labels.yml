# The label inventory. `bun scripts/labels.ts --check` proves the live repository matches this
# file; `--apply` makes it match. Meaning belongs to docs/TRIAGE.md §Label model — this file is
# the inventory, never a second definition. A live label missing here is reported, never deleted.

# ── State: exactly one on every open non-tracking issue (docs/TRIAGE.md §Label model)
- name: "needs-triage"
  color: "d4c5f9"
  description: "Default state: not yet classified; triage assigns type, area, priority and a state"
- name: "needs-operator"
  color: "b60205"
  description: "Held for a concrete operator decision recorded as a ## Decision block; the triage runbook drives it to resolution"
- name: "agent-ready"
  color: "0e8a16"
  description: "Scoped, prioritized and settled: an agent may claim it and open a PR without asking"
- name: "blocked"
  color: "e99695"
  description: "Waits on another issue or PR named in the body"

# ── Priority: required on agent-ready (docs/TRIAGE.md §Priority rubric)
- name: "p0"
  color: "b60205"
  description: "Priority: confirmed security exposure, data loss, instance down or release blocked — work starts now"
- name: "p1"
  color: "d93f0b"
  description: "Priority: contract violation or bug on a documented path, or prerequisite for p0/p1 work"
- name: "p2"
  color: "fbca04"
  description: "Priority: accepted bug, enhancement or audit finding — the default"
- name: "p3"
  color: "c2e0c6"
  description: "Priority: hygiene, consistency, nice-to-have"

# ── Signal: applied and removed by scripts/triage-policy.ts from human activity
- name: "aging"
  color: "bfd4f2"
  description: "No human activity for 14 days; a signal for review, never a reason to close"

# ── Type
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"
- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"
- name: "process"
  color: "5319e7"
  description: "Repository process: CI/CD, releases, coordination, audits"
- name: "design"
  color: "c5def5"
  description: "Needs a design or decision before implementation"
- name: "audit"
  color: "fbca04"
  description: "Finding from a hand-run audit brief (docs/audits)"
- name: "prerequisite"
  color: "0e8a16"
  description: "Blocks other tracked work"
- name: "tracking"
  color: "006b75"
  description: "Umbrella issue with a checklist of tracked items"
- name: "accessibility"
  color: "f143ab"
  description: "Barrier affecting people with disabilities"

# ── Plugin family
- name: "babel-plugin"
  color: "5319e7"
  description: "Prerequisite for Babel, the first non-core plugin (atyrode/babel docs/manifold-transition.md)"
- name: "code-plugin"
  color: "1d76db"
  description: "Found making code (atyrode/code) the second non-core plugin; see its docs/manifold-transition.md"

# ── Area: the package or surface a code change lands in, in the commit-prefix vocabulary
- name: "area:protocol"
  color: "c5def5"
  description: "Lands in packages/protocol or its surface"
- name: "area:server"
  color: "c5def5"
  description: "Lands in packages/server or its surface"
- name: "area:web"
  color: "c5def5"
  description: "Lands in packages/web or its surface"
- name: "area:agent"
  color: "c5def5"
  description: "Lands in packages/agent or its surface"
- name: "area:sdk"
  color: "c5def5"
  description: "Lands in packages/sdk or its surface"
- name: "area:plugins"
  color: "c5def5"
  description: "Lands under packages/plugin or packages/plugins/*"
- name: "area:infra"
  color: "c5def5"
  description: "CI/CD, deploy, previews, docker, nix (scaffold: commits)"

# ── Exit and intake vocabulary (GitHub defaults kept in use)
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"
- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"
- name: "question"
  color: "d876e3"
  description: "Further information is requested"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
