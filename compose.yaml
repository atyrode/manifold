# Self-hosted manifold hub: `docker compose up -d --build` on any box with a DNS
# record makes it the master node AND a terminal-serving machine (docs/SELF-HOST.md).
services:
  manifold:
    # A published image (`MANIFOLD_IMAGE=ghcr.io/<owner>/manifold:<tag> docker compose
    # pull`) or, absent one, the local build tagged `manifold:local`.
    image: ${MANIFOLD_IMAGE:-manifold:local}
    build:
      context: .
      args:
        # `MANIFOLD_BUILD=$(git rev-parse --short HEAD) docker compose up -d --build`
        # stamps /healthz with the deployed tree; defaults to "dev" when unset.
        MANIFOLD_BUILD: ${MANIFOLD_BUILD:-dev}
        # Optional build-time browser identity; unset inputs preserve production branding.
        VITE_MANIFOLD_SITE_TITLE: ${VITE_MANIFOLD_SITE_TITLE:-manifold}
        VITE_MANIFOLD_ICON_BACKGROUND: ${VITE_MANIFOLD_ICON_BACKGROUND:-}
    restart: unless-stopped
    environment:
      - MANIFOLD_PUBLIC_URL=https://${MANIFOLD_DOMAIN:?set MANIFOLD_DOMAIN in .env}
      - MANIFOLD_MACHINE_NAME=${MANIFOLD_MACHINE_NAME:-hub}
      # Passthrough only when set in .env: pins the owner key instead of
      # generating one at /data/owner.key on first boot.
      - MANIFOLD_OWNER_KEY
      # Passthrough only when set in .env: "0" retires the in-container agent.
      - MANIFOLD_SPAWN_AGENT
      # Passthrough only when set in .env: optional replication of manifold.db to
      # any S3-compatible store (docs/SELF-HOST.md §Replicate the database).
      - MANIFOLD_REPLICA_BUCKET
      - MANIFOLD_REPLICA_ENDPOINT
      - LITESTREAM_ACCESS_KEY_ID
      - LITESTREAM_SECRET_ACCESS_KEY
    volumes:
      - manifold-data:/data
    # No published ports: only Caddy reaches manifold:7777 on the compose network.

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - MANIFOLD_DOMAIN=${MANIFOLD_DOMAIN:?set MANIFOLD_DOMAIN in .env}
    volumes:
      - ./infra/compose.Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  manifold-data:
  caddy-data:
  caddy-config:
