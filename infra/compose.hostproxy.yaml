# Override for boxes that already run a host reverse proxy (Caddy/nginx) on
# 80/443: publish manifold on loopback only and do not start the bundled caddy.
#
#   docker compose -f compose.yaml -f infra/compose.hostproxy.yaml up -d --build manifold
#
# Point the existing proxy's vhost at 127.0.0.1:7777 (see
# infra/manifold.tyrode.dev.Caddyfile for the Caddy block).
services:
  manifold:
    ports:
      - "127.0.0.1:7777:7777"
